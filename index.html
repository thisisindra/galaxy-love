<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Untuk Kamu ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4);
        position: relative;
        padding: 20px;
      }

      .love {
        position: absolute;
        color: rgba(255, 255, 255, 0.6);
        animation: float 6s linear infinite;
        pointer-events: none;
      }

      @keyframes float {
        0% {
          transform: translateY(100vh) scale(0.5);
          opacity: 0;
        }

        50% {
          opacity: 1;
        }

        100% {
          transform: translateY(-100px) scale(1.2);
          opacity: 0;
        }
      }

      .card {
        width: 100%;
        max-width: 500px;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(15px);
        padding: 40px 30px;
        border-radius: 30px;
        text-align: center;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      }

      h1 {
        font-size: 2.2rem;
        color: white;
        margin-bottom: 15px;
      }

      p {
        color: white;
        margin-bottom: 35px;
      }

      .buttons {
        position: relative;
        width: 100%;
        height: 170px;
        overflow: hidden;
      }

      button {
        border: none;
        width: 140px;
        height: 50px;
        border-radius: 50px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }

      #yesBtn {
        position: absolute;
        left: 40px;
        top: 55px;
        background: white;
        color: #ff4b91;
      }

      #noBtn {
        position: absolute;
        right: 40px;
        top: 55px;
        background: #ff4b91;
        color: white;
      }

      .popup {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        justify-content: center;
        align-items: center;
      }

      .popup-content {
        background: white;
        padding: 35px;
        border-radius: 25px;
        text-align: center;
        width: 90%;
        max-width: 400px;
      }

      .popup-content h2 {
        color: #ff4b91;
        margin-bottom: 15px;
      }

      .popup-content p {
        color: #555;
      }

      .popup-content button {
        background: #ff4b91;
        color: white;
      }

      @media (max-width: 600px) {
        h1 {
          font-size: 1.7rem;
        }

        .buttons {
          height: 220px;
        }

        #yesBtn {
          left: 50%;
          top: 20px;
          transform: translateX(-50%);
        }

        #noBtn {
          left: 50%;
          top: 100px;
          right: auto;
          transform: translateX(-50%);
        }
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>Hai Dwi Styaningsih<br />Kamu Sayang Aku Ga?</h1>

      <p>Jawab yang jujur ya 😄</p>

      <div class="buttons">
        <button id="yesBtn">Ya</button>
        <button id="noBtn">Tidak</button>
      </div>
    </div>

    <div class="popup" id="popup">
      <div class="popup-content">
        <h2>Aku Juga Sayang Kamu ❤️</h2>
        <p>Makasih udah memilih "Ya" 😄</p>
        <button onclick="goSpace()">Tutup</button>
      </div>
    </div>

    <script>
      function createLove() {
        const love = document.createElement("div");

        love.classList.add("love");
        love.innerHTML = "❤️";

        love.style.left = Math.random() * window.innerWidth + "px";
        love.style.fontSize = Math.random() * 20 + 10 + "px";

        document.body.appendChild(love);

        setTimeout(() => {
          love.remove();
        }, 6000);
      }

      setInterval(createLove, 300);

      const noBtn = document.getElementById("noBtn");
      const yesBtn = document.getElementById("yesBtn");
      const buttons = document.querySelector(".buttons");
      const popup = document.getElementById("popup");

      function moveNoButton() {
        const areaWidth = buttons.clientWidth;
        const areaHeight = buttons.clientHeight;

        const btnWidth = noBtn.offsetWidth;
        const btnHeight = noBtn.offsetHeight;

        const randomX = Math.random() * (areaWidth - btnWidth);
        const randomY = Math.random() * (areaHeight - btnHeight);

        noBtn.style.left = randomX + "px";
        noBtn.style.top = randomY + "px";
        noBtn.style.right = "auto";
      }

      noBtn.addEventListener("click", (e) => {
        e.preventDefault();
        moveNoButton();
      });

      yesBtn.addEventListener("click", () => {
        popup.style.display = "flex";
      });

      function goSpace() {
        window.location.href = "space.html";
      }
    </script>
  </body>
</html>
