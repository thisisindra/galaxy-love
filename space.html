<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galaxy Love</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: none;
        font-family: sans-serif;
      }

      /* GALAXY AREA */
      .universe {
        position: absolute;
        width: 300vw;
        height: 300vh;
        background:
          radial-gradient(circle at center, rgba(61, 89, 255, 0.2), transparent 25%), radial-gradient(circle at 20% 30%, rgba(255, 0, 140, 0.2), transparent 20%), radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.15), transparent 25%),
          radial-gradient(circle at 50% 50%, #030311 0%, #000 100%);
        cursor: grab;
      }

      .universe:active {
        cursor: grabbing;
      }

      /* STARS */
      .stars {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(white 1px, transparent 1px), radial-gradient(#ffffffaa 1px, transparent 1px), radial-gradient(#ffb3d9 1px, transparent 1px), radial-gradient(#8be9fd 1px, transparent 1px);
        background-size:
          120px 120px,
          200px 200px,
          300px 300px,
          400px 400px;
        animation: moveStars 120s linear infinite;
        opacity: 0.9;
      }

      @keyframes moveStars {
        from {
          transform: translateY(0);
        }

        to {
          transform: translateY(-500px);
        }
      }

      /* GALAXY CLOUD */
      .nebula {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.35;
        animation: pulse 8s ease-in-out infinite;
      }

      .nebula1 {
        width: 500px;
        height: 500px;
        background: #ff4fd8;
        top: 300px;
        left: 500px;
      }

      .nebula2 {
        width: 600px;
        height: 600px;
        background: #4f7dff;
        top: 1200px;
        left: 1500px;
      }

      .nebula3 {
        width: 450px;
        height: 450px;
        background: #7dffcf;
        top: 1800px;
        left: 900px;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.1);
        }

        100% {
          transform: scale(1);
        }
      }

      /* PLANETS */
      .planet {
        position: absolute;
        border-radius: 50%;
        box-shadow: 0 0 80px rgba(255, 255, 255, 0.3);
      }

      .planet1 {
        width: 300px;
        height: 300px;
        background: linear-gradient(135deg, #ff7eb3, #7f5cff);
        top: 200px;
        right: 400px;
      }

      .planet2 {
        width: 180px;
        height: 180px;
        background: linear-gradient(135deg, #6ee7ff, #2563eb);
        top: 1500px;
        left: 300px;
      }

      .planet3 {
        width: 240px;
        height: 240px;
        background: linear-gradient(135deg, #fff, #aaa);
        top: 2100px;
        right: 700px;
      }

      /* PHOTO STYLE */
      .photo {
        position: absolute;
        width: 170px;
        height: 230px;
        border-radius: 25px;
        overflow: hidden;
        border: 3px solid rgba(255, 255, 255, 0.9);
        box-shadow:
          0 0 25px rgba(255, 255, 255, 0.5),
          0 0 70px rgba(255, 105, 180, 0.3);
        animation: float 6s ease-in-out infinite;
        backdrop-filter: blur(8px);
        transition: 0.4s;
      }

      .photo:hover {
        transform: scale(1.08);
        box-shadow:
          0 0 40px rgba(255, 255, 255, 0.9),
          0 0 100px rgba(255, 105, 180, 0.6);
      }

      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      @keyframes float {
        0% {
          transform: translateY(0px);
        }

        50% {
          transform: translateY(-20px);
        }

        100% {
          transform: translateY(0px);
        }
      }

      /* GANTI SEMUA POSISI FOTO YANG LAMA MENJADI INI */

      /* MANY PHOTOS */
      .p1 {
        top: 700px;
        left: 900px;
      }

      .p2 {
        top: 850px;
        left: 1150px;
      }

      .p3 {
        top: 1050px;
        left: 950px;
      }

      .p4 {
        top: 1200px;
        left: 1250px;
      }

      .p5 {
        top: 1450px;
        left: 1050px;
      }

      .p6 {
        top: 900px;
        left: 1450px;
      }

      .p7 {
        top: 1150px;
        left: 1550px;
      }

      .p8 {
        top: 1350px;
        left: 1400px;
      }

      .p9 {
        top: 1600px;
        left: 1200px;
      }

      .p10 {
        top: 1750px;
        left: 950px;
      }

      .p11 {
        top: 1500px;
        left: 1550px;
      }

      .p12 {
        top: 750px;
        left: 1450px;
      }
      /* SHOOTING STAR */
      .shooting-star {
        position: absolute;
        width: 3px;
        height: 120px;
        background: linear-gradient(transparent, white);
        transform: rotate(45deg);
        opacity: 0.7;
        animation: shooting 5s linear infinite;
      }

      .shooting-star:nth-child(1) {
        top: 0;
        left: 20%;
        animation-delay: 0s;
      }

      .shooting-star:nth-child(2) {
        top: 200px;
        left: 60%;
        animation-delay: 2s;
      }

      .shooting-star:nth-child(3) {
        top: 500px;
        left: 80%;
        animation-delay: 4s;
      }

      @keyframes shooting {
        0% {
          transform: translate(0, 0) rotate(45deg);
          opacity: 0;
        }

        10% {
          opacity: 1;
        }

        100% {
          transform: translate(800px, 800px) rotate(45deg);
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <div class="universe" id="universe">
      <div class="stars"></div>

      <div class="nebula nebula1"></div>
      <div class="nebula nebula2"></div>
      <div class="nebula nebula3"></div>

      <div class="planet planet1"></div>
      <div class="planet planet2"></div>
      <div class="planet planet3"></div>

      <div class="shooting-star"></div>
      <div class="shooting-star"></div>
      <div class="shooting-star"></div>

      <!-- FOTO -->
      <div class="photo p1"><img src="dwi1.jpeg" /></div>
      <div class="photo p2"><img src="dwi2.jpeg" /></div>
      <div class="photo p3"><img src="dwi3.jpeg" /></div>
      <div class="photo p4"><img src="dwi4.jpeg" /></div>
      <div class="photo p5"><img src="dwi5.jpeg" /></div>

      <div class="photo p6"><img src="dwi1.jpeg" /></div>
      <div class="photo p7"><img src="dwi2.jpeg" /></div>
      <div class="photo p8"><img src="dwi3.jpeg" /></div>
      <div class="photo p9"><img src="dwi4.jpeg" /></div>
      <div class="photo p10"><img src="dwi5.jpeg" /></div>

      <div class="photo p11"><img src="dwi2.jpeg" /></div>
      <div class="photo p12"><img src="dwi4.jpeg" /></div>
    </div>

    <script>
      const universe = document.getElementById("universe");

      let isDragging = false;
      let startX, startY;
      let currentX = -800;
      let currentY = -800;

      universe.style.transform = `translate(${currentX}px, ${currentY}px)`;

      function startDrag(x, y) {
        isDragging = true;
        startX = x - currentX;
        startY = y - currentY;
      }

      function drag(x, y) {
        if (!isDragging) return;

        currentX = x - startX;
        currentY = y - startY;

        universe.style.transform = `translate(${currentX}px, ${currentY}px)`;
      }

      function endDrag() {
        isDragging = false;
      }

      // Desktop
      window.addEventListener("mousedown", (e) => {
        startDrag(e.clientX, e.clientY);
      });

      window.addEventListener("mousemove", (e) => {
        drag(e.clientX, e.clientY);
      });

      window.addEventListener("mouseup", endDrag);

      // Mobile
      window.addEventListener("touchstart", (e) => {
        startDrag(e.touches[0].clientX, e.touches[0].clientY);
      });

      window.addEventListener("touchmove", (e) => {
        drag(e.touches[0].clientX, e.touches[0].clientY);
      });

      window.addEventListener("touchend", endDrag);
    </script>

    <!-- TARUH SEBELUM </body> -->

    <audio id="bg-music" autoplay loop>
      <source src="musik.mp3" type="audio/mp3" />
    </audio>

    <script>
      // Biar audio tetap jalan di HP
      const music = document.getElementById("bg-music");

      function playMusic() {
        music.play();

        document.removeEventListener("click", playMusic);
        document.removeEventListener("touchstart", playMusic);
      }

      document.addEventListener("click", playMusic);
      document.addEventListener("touchstart", playMusic);
    </script>

    <!-- OPTIONAL: TOMBOL MUSIK KEREN -->

    <button class="music-btn" onclick="toggleMusic()">🎵</button>

    <style>
      .music-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        color: white;
        font-size: 24px;
        cursor: pointer;
        z-index: 9999;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        transition: 0.3s;
      }

      .music-btn:hover {
        transform: scale(1.1);
        background: rgba(255, 255, 255, 0.25);
      }
    </style>

    <script>
      function toggleMusic() {
        if (music.paused) {
          music.play();
        } else {
          music.pause();
        }
      }
    </script>
  </body>
</html>
