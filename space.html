<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmic Luxury</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
        font-family: sans-serif;
        touch-action: none;
      }

      /* OVERLAY */

      .overlay {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, transparent 20%, rgba(0, 0, 0, 0.4) 100%);

        pointer-events: none;
        z-index: 10;
      }

      /* HERO */

      .hero-text {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        z-index: 100;
        text-align: center;
        pointer-events: none;
      }

      .hero-text h1 {
        color: white;

        font-size: clamp(42px, 9vw, 120px);

        letter-spacing: 10px;

        font-weight: 200;

        text-transform: uppercase;

        text-shadow:
          0 0 20px rgba(255, 255, 255, 0.6),
          0 0 60px rgba(68, 94, 255, 0.45);
      }

      .hero-text p {
        margin-top: 15px;

        color: rgba(255, 255, 255, 0.7);

        letter-spacing: 5px;

        font-size: 12px;
      }

      /* UNIVERSE */

      .universe {
        position: absolute;

        width: 50000px;
        height: 50000px;

        background:
          radial-gradient(circle at center, rgba(255, 255, 255, 0.04), transparent 60%), radial-gradient(circle at 20% 30%, rgba(66, 95, 255, 0.2), transparent 30%),
          radial-gradient(circle at 80% 60%, rgba(162, 0, 255, 0.15), transparent 35%), radial-gradient(circle at center, #050510 0%, black 100%);

        cursor: grab;
      }

      .universe:active {
        cursor: grabbing;
      }

      /* STARS */

      .stars,
      .stars2,
      .stars3 {
        position: absolute;
        inset: 0;
      }

      .stars {
        background-image: radial-gradient(white 1px, transparent 1px);

        background-size: 100px 100px;

        opacity: 0.7;

        animation: starsMove 200s linear infinite;
      }

      .stars2 {
        background-image: radial-gradient(rgba(255, 255, 255, 0.7) 1px, transparent 1px);

        background-size: 180px 180px;

        opacity: 0.4;

        animation: starsMove 300s linear infinite reverse;
      }

      .stars3 {
        background-image: radial-gradient(rgba(126, 177, 255, 0.8) 1px, transparent 1px);

        background-size: 260px 260px;

        opacity: 0.25;

        animation: starsMove 500s linear infinite;
      }

      @keyframes starsMove {
        from {
          transform: translateY(0);
        }

        to {
          transform: translateY(-1000px);
        }
      }

      /* NEBULA */

      .nebula {
        position: absolute;
        border-radius: 50%;
        filter: blur(140px);
        opacity: 0.4;

        animation: pulse 10s ease-in-out infinite;
      }

      .nebula1 {
        width: 900px;
        height: 900px;
        background: #204cff;
        top: 500px;
        left: 600px;
      }

      .nebula2 {
        width: 1200px;
        height: 1200px;
        background: #6500ff;
        top: 2500px;
        left: 2800px;
      }

      .nebula3 {
        width: 1000px;
        height: 1000px;
        background: #00c3ff;
        top: 5000px;
        left: 1800px;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.15);
        }

        100% {
          transform: scale(1);
        }
      }

      /* PLANETS */

      .planet {
        position: absolute;
        border-radius: 50%;
        overflow: hidden;
      }

      .planet::before {
        content: "";
        position: absolute;
        inset: 0;

        border-radius: 50%;

        background: linear-gradient(145deg, rgba(255, 255, 255, 0.45), transparent 40%);
      }

      .planet1 {
        width: 450px;
        height: 450px;

        top: 400px;
        right: 1200px;

        background: radial-gradient(circle at 30% 30%, white, #617cff 20%, #10185a 70%);

        box-shadow:
          0 0 150px rgba(92, 123, 255, 0.5),
          0 0 300px rgba(92, 123, 255, 0.25);
      }

      .planet2 {
        width: 250px;
        height: 250px;

        top: 3000px;
        left: 700px;

        background: radial-gradient(circle at 30% 30%, white, #4de2ff 20%, #003b61 70%);

        box-shadow: 0 0 120px rgba(0, 174, 255, 0.4);
      }

      .planet3 {
        width: 340px;
        height: 340px;

        top: 7000px;
        right: 2000px;

        background: radial-gradient(circle at 30% 30%, white, #d4d4d4 20%, #3f3f3f 75%);

        box-shadow: 0 0 100px rgba(255, 255, 255, 0.25);
      }

      /* RING */

      .ring {
        position: absolute;

        border: 3px solid rgba(255, 255, 255, 0.15);

        border-radius: 50%;

        transform: rotateX(70deg);
      }

      .ring1 {
        width: 650px;
        height: 650px;

        top: 300px;
        right: 1100px;
      }

      /* SHOOTING STAR */

      .shooting-star {
        position: absolute;

        width: 2px;
        height: 250px;

        background: linear-gradient(transparent, white);

        transform: rotate(45deg);

        opacity: 0.8;

        animation: shooting 7s linear infinite;
      }

      .shooting-star:nth-child(1) {
        top: 0;
        left: 10%;
      }

      .shooting-star:nth-child(2) {
        top: 500px;
        left: 70%;
        animation-delay: 2s;
      }

      .shooting-star:nth-child(3) {
        top: 1200px;
        left: 40%;
        animation-delay: 4s;
      }

      @keyframes shooting {
        0% {
          transform: translate(0, 0) rotate(45deg);

          opacity: 0;
        }

        10% {
          opacity: 1;
        }

        100% {
          transform: translate(1400px, 1400px) rotate(45deg);

          opacity: 0;
        }
      }

      /* PHOTO */

      #photo-container {
        position: absolute;
        width: 50000px;
        height: 50000px;
      }

      .photo {
        position: absolute;

        width: 130px;
        height: 180px;

        border-radius: 26px;

        overflow: hidden;

        background: rgba(255, 255, 255, 0.06);

        backdrop-filter: blur(20px);

        border: 1px solid rgba(255, 255, 255, 0.15);

        box-shadow:
          0 0 30px rgba(255, 255, 255, 0.08),
          0 0 90px rgba(89, 0, 255, 0.25);

        animation: floatPhoto 8s ease-in-out infinite;

        transition: 0.5s;
      }

      .photo:hover {
        transform: scale(1.08);

        box-shadow:
          0 0 45px rgba(255, 255, 255, 0.2),
          0 0 140px rgba(98, 0, 255, 0.45);
      }

      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      @keyframes floatPhoto {
        0% {
          transform: translateY(0px);
        }

        50% {
          transform: translateY(-18px);
        }

        100% {
          transform: translateY(0px);
        }
      }

      /* MUSIC BUTTON */

      .music-btn {
        position: fixed;

        right: 20px;
        bottom: 20px;

        width: 68px;
        height: 68px;

        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.2);

        background: rgba(255, 255, 255, 0.08);

        backdrop-filter: blur(20px);

        color: white;

        font-size: 11px;
        letter-spacing: 2px;

        cursor: pointer;

        z-index: 9999;

        transition: 0.4s;

        box-shadow:
          0 0 30px rgba(255, 255, 255, 0.1),
          0 0 100px rgba(74, 74, 255, 0.3);
      }

      .music-btn:hover {
        transform: scale(1.1);
      }

      /* MOBILE */

      @media (max-width: 768px) {
        .hero-text {
          width: 100%;
          padding: 0 20px;
        }

        .hero-text h1 {
          font-size: 42px;
          letter-spacing: 5px;
          line-height: 1.2;
        }

        .hero-text p {
          font-size: 10px;
          letter-spacing: 3px;
        }

        .photo {
          width: 105px;
          height: 150px;
        }

        .planet1 {
          width: 260px;
          height: 260px;
        }

        .planet2 {
          width: 150px;
          height: 150px;
        }

        .planet3 {
          width: 190px;
          height: 190px;
        }

        .ring1 {
          width: 350px;
          height: 350px;
        }
      }
    </style>
  </head>

  <body>
    <div class="hero-text">
      <h1>Infinite Space</h1>
      <p>Luxury Cosmic Experience</p>
    </div>

    <div class="universe" id="universe">
      <div class="stars"></div>
      <div class="stars2"></div>
      <div class="stars3"></div>

      <div class="nebula nebula1"></div>
      <div class="nebula nebula2"></div>
      <div class="nebula nebula3"></div>

      <div class="planet planet1"></div>
      <div class="ring ring1"></div>

      <div class="planet planet2"></div>
      <div class="planet planet3"></div>

      <div class="shooting-star"></div>
      <div class="shooting-star"></div>
      <div class="shooting-star"></div>

      <!-- CONTAINER FOTO -->
      <div id="photo-container"></div>
    </div>

    <!-- MUSIC -->

    <audio id="bg-music" autoplay loop>
      <source src="musik.mp3" type="audio/mp3" />
    </audio>

    <button class="music-btn" onclick="toggleMusic()">MUSIC</button>

    <script>
      /* =========================
           UNIVERSE DRAG
        ========================= */

      const universe = document.getElementById("universe");

      let isDragging = false;

      let startX;
      let startY;

      // POSISI AWAL HP
      let currentX = -7000;
      let currentY = -7000;

      universe.style.transform = `translate(${currentX}px, ${currentY}px)`;

      function startDrag(x, y) {
        isDragging = true;

        startX = x - currentX;
        startY = y - currentY;
      }

      function drag(x, y) {
        if (!isDragging) return;

        currentX = x - startX;
        currentY = y - startY;

        universe.style.transform = `translate(${currentX}px, ${currentY}px)`;
      }

      function endDrag() {
        isDragging = false;
      }

      /* DESKTOP */

      window.addEventListener("mousedown", (e) => {
        startDrag(e.clientX, e.clientY);
      });

      window.addEventListener("mousemove", (e) => {
        drag(e.clientX, e.clientY);
      });

      window.addEventListener("mouseup", endDrag);

      /* MOBILE */

      window.addEventListener(
        "touchstart",
        (e) => {
          startDrag(e.touches[0].clientX, e.touches[0].clientY);
        },
        { passive: true },
      );

      window.addEventListener(
        "touchmove",
        (e) => {
          drag(e.touches[0].clientX, e.touches[0].clientY);
        },
        { passive: true },
      );

      window.addEventListener("touchend", endDrag);

      /* =========================
           MUSIC
        ========================= */

      const music = document.getElementById("bg-music");

      function playMusic() {
        music.play();

        document.removeEventListener("click", playMusic);

        document.removeEventListener("touchstart", playMusic);
      }

      document.addEventListener("click", playMusic);

      document.addEventListener("touchstart", playMusic);

      function toggleMusic() {
        if (music.paused) {
          music.play();
        } else {
          music.pause();
        }
      }

      /* =========================
           FOTO TAK TERBATAS
        ========================= */

      const photoContainer = document.getElementById("photo-container");

      const images = ["dwi1.jpeg", "dwi2.jpeg", "dwi3.jpeg", "dwi4.jpeg", "dwi5.jpeg"];

      // SUPER BANYAK
      const totalPhotos = 5000;

      // AREA SUPER BESAR
      const areaWidth = 50000;
      const areaHeight = 50000;

      for (let i = 0; i < totalPhotos; i++) {
        const photo = document.createElement("div");

        photo.className = "photo";

        const img = document.createElement("img");

        img.src = images[Math.floor(Math.random() * images.length)];

        photo.appendChild(img);

        // POSISI RANDOM
        const cols = 70;

        const spacingX = 150;
        const spacingY = 190;

        const row = Math.floor(i / cols);
        const col = i % cols;

        const randomOffsetX = Math.random() * 60 - 30;

        const randomOffsetY = Math.random() * 60 - 30;

        const x = col * spacingX + randomOffsetX;

        const y = row * spacingY + randomOffsetY;

        // ROTASI
        const rotate = Math.random() * 10 - 5;

        // FLOAT RANDOM
        const duration = 6 + Math.random() * 6;

        const delay = Math.random() * 5;

        photo.style.left = `${x}px`;

        photo.style.top = `${y}px`;

        photo.style.transform = `rotate(${rotate}deg)`;

        photo.style.animationDuration = `${duration}s`;

        photo.style.animationDelay = `${delay}s`;

        photoContainer.appendChild(photo);
      }

      /* =========================
           RANDOM STARS
        ========================= */

      for (let i = 0; i < 1500; i++) {
        const star = document.createElement("div");

        const size = Math.random() * 3;

        star.style.position = "absolute";

        star.style.width = `${size}px`;

        star.style.height = `${size}px`;

        star.style.borderRadius = "50%";

        star.style.background = "white";

        star.style.left = `${Math.random() * areaWidth}px`;

        star.style.top = `${Math.random() * areaHeight}px`;

        star.style.opacity = Math.random();

        star.style.boxShadow = "0 0 12px rgba(255,255,255,0.9)";

        photoContainer.appendChild(star);
      }
    </script>
  </body>
</html>
